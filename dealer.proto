syntax = "proto3";

option csharp_namespace = "dealer.api";

package dealer;

option go_package = "./;dealer";

service Dealers {
  rpc FindBasic(FindRequest) returns (Dealer);
}

message FindRequest {
  string labcode = 1;
  string dealernumber = 2;
}

message Dealer {
  string labcode = 1;
  string dealernumber = 2;
  string address = 3;
}
